<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  /* Render at --window-size=256,256. ?variant=glyph renders the bold transparent toolbar glyph. */
  html, body { margin: 0; width: 256px; height: 256px; background: transparent; overflow: hidden; }
</style></head>
<body>
<svg id="tile" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2655"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <!-- agent prompt -->
  <circle cx="70" cy="128" r="34" stroke="#fbbf24" stroke-width="10"/>
  <path d="M59 113 L74 128 L59 143" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bridge arcs: request over, answer back -->
  <path d="M106 108 C 124 80, 146 80, 160 102" stroke="#fbbf24" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 16"/>
  <path d="M160 154 C 146 176, 124 176, 106 148" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 16"/>
  <!-- card -->
  <rect x="158" y="96" width="72" height="64" rx="13" stroke="#5eead4" stroke-width="10"/>
  <path d="M176 120 H212 M176 137 H200" stroke="#5eead4" stroke-width="9" stroke-linecap="round"/>
</svg>
<svg id="glyph" width="256" height="256" viewBox="0 0 256 256" fill="none" style="display:none">
  <!-- toolbar glyph: prompt over a card, heavy strokes so it survives 44 px -->
  <rect x="28" y="28" width="200" height="200" rx="44" stroke="#6b7280" stroke-width="22"/>
  <path d="M74 88 L104 118 L74 148" stroke="#6b7280" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 148 H182" stroke="#6b7280" stroke-width="22" stroke-linecap="round"/>
  <path d="M74 186 H182" stroke="#6b7280" stroke-width="16" stroke-linecap="round" opacity=".55"/>
</svg>
<script>
  if (new URLSearchParams(location.search).get('variant') === 'glyph') {
    document.getElementById('tile').style.display = 'none';
    document.getElementById('glyph').style.display = 'block';
  }
</script>
</body></html>
